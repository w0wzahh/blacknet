openapi: 3.0.3
info:
  title: Blacknet API
  version: 2.0.0
  description: |
    REST API for the Blacknet DNS filter. All endpoints are under /api/v1.
    Authentication: session cookie (from /auth/login) or "Authorization: Bearer
    <token>" with the local API token stored at <data_dir>/api.token.
    Cookie-authenticated mutations must send the header "X-Requested-With: XMLHttpRequest" (CSRF).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Service health (public)
      security: []
      responses:
        '200': { description: Health snapshot }
  /auth/login:
    post:
      summary: Log in with the admin password
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string } }
      responses:
        '200': { description: Session cookie set }
        '401': { description: Invalid password }
        '429': { description: Rate limited }
  /auth/logout:
    post:
      summary: Destroy the session
      responses: { '200': { description: Logged out } }
  /auth/state:
    get:
      summary: Authentication/setup state (public)
      security: []
      responses: { '200': { description: password_set, authenticated, setup_completed } }
  /setup/password:
    post:
      summary: Set the initial admin password (works once)
      security: []
      responses:
        '200': { description: Password set, session created }
        '409': { description: Password already configured }
  /status:
    get:
      summary: Service status, counters, cache and upstream health
      responses: { '200': { description: Status object } }
  /about:
    get:
      summary: Version and license info
      responses: { '200': { description: About info } }
  /audit:
    get:
      summary: Recent audit events
      responses: { '200': { description: Audit entries } }
  /stats/summary:
    get:
      summary: Aggregate statistics
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d] } }
      responses: { '200': { description: totals, blocked, pct, unique domains, clients, latency } }
  /stats/timeseries:
    get:
      summary: Bucketed query counts
      parameters:
        - { name: window, in: query, schema: { type: string } }
        - { name: buckets, in: query, schema: { type: integer, maximum: 500 } }
      responses: { '200': { description: array of {ts,total,blocked,allowed} } }
  /stats/top-domains:
    get:
      parameters:
        - { name: blocked, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: window, in: query, schema: { type: string } }
      responses: { '200': { description: ranked domains } }
  /stats/top-clients:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: window, in: query, schema: { type: string } }
      responses: { '200': { description: ranked clients with aliases } }
  /queries:
    get:
      summary: Paginated query log
      parameters:
        - { name: domain, in: query, schema: { type: string } }
        - { name: client, in: query, schema: { type: string } }
        - { name: blocked, in: query, schema: { type: boolean } }
        - { name: qtype, in: query, schema: { type: integer } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 1000 } }
      responses: { '200': { description: items + total + pagination } }
  /queries/export:
    get:
      summary: CSV export of filtered queries
      parameters:
        - { name: domain, in: query, schema: { type: string } }
        - { name: client, in: query, schema: { type: string } }
        - { name: blocked, in: query, schema: { type: boolean } }
      responses: { '200': { description: text/csv } }
  /queries/live:
    get:
      summary: Server-Sent Events stream of live query events
      responses: { '200': { description: text/event-stream } }
  /clients:
    get:
      summary: List known clients
      responses: { '200': { description: clients with stats } }
    post:
      summary: Register a client by IP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip: { type: string }
                alias: { type: string }
                group: { type: string }
      responses: { '201': { description: client }, '400': { description: invalid ip } }
  /clients/{id}:
    patch:
      summary: Update alias/group
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated }, '404': { description: not found } }
    delete:
      summary: Forget a client and its stats
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /clients/{id}/reset-stats:
    post:
      summary: Zero client counters (requires ?confirm=true)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: reset }, '400': { description: confirm missing } }
  /clients/{id}/queries:
    get:
      summary: Recent queries for a client
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: query rows } }
  /blocklists:
    get:
      summary: List blocklist sources
      responses: { '200': { description: blocklists } }
    post:
      summary: Add a blocklist by URL (https only by default)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties: { name: { type: string }, url: { type: string } }
      responses: { '201': { description: created, download starts in background }, '400': { description: invalid/blocked URL }, '409': { description: duplicate } }
  /blocklists/{id}:
    patch:
      summary: Enable/disable or rename a list
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated } }
    delete:
      summary: Delete a list and its imported domains
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /blocklists/{id}/refresh:
    post:
      summary: Re-download and re-import a list
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: refresh result }, '502': { description: refresh failed; previous data kept } }
  /blocklists/validate:
    post:
      summary: Check whether a URL would be accepted (SSRF policy)
      responses: { '200': { description: '{valid,error}' } }
  /rules:
    get:
      summary: List user rules
      responses: { '200': { description: rules } }
    post:
      summary: Create a rule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain, action]
              properties:
                domain: { type: string }
                action: { type: string, enum: [allow, block] }
                scope: { type: string, enum: [exact, tree], default: exact }
                client_id: { type: integer, default: 0 }
                comment: { type: string }
                enabled: { type: boolean, default: true }
      responses: { '201': { description: created }, '400': { description: invalid }, '409': { description: duplicate } }
  /rules/{id}:
    patch:
      summary: Update a rule
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated } }
    delete:
      summary: Delete a rule
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /rules/test:
    post:
      summary: Evaluate a domain against the live engine
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties: { domain: { type: string }, client_id: { type: integer } }
      responses: { '200': { description: decision {blocked,reason,rule,list_id} } }
  /rules/export:
    get:
      summary: Export rules as text
      responses: { '200': { description: text/plain } }
  /rules/import:
    post:
      summary: Bulk import rules ("<allow|block> <domain>" per line)
      responses: { '200': { description: '{added,skipped_duplicates,errors}' } }
  /upstreams:
    get:
      summary: List upstreams with live stats
      responses: { '200': { description: upstreams + stats } }
    post:
      summary: Add upstream (udp|tcp|dot|doh)
      responses: { '201': { description: created }, '400': { description: invalid } }
  /upstreams/{id}:
    patch:
      responses: { '200': { description: updated } }
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    delete:
      responses: { '200': { description: deleted } }
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
  /upstreams/test:
    post:
      summary: Perform a real resolution test. {id} for one, full config for ad-hoc, {} for all.
      responses: { '200': { description: per-resolver stats } }
  /settings:
    get:
      summary: Runtime settings
      responses: { '200': { description: settings } }
    patch:
      summary: Partial update; validated and applied live where possible
      responses: { '200': { description: updated settings }, '400': { description: per-field errors } }
  /cache/flush:
    post:
      summary: Flush the DNS cache (no restart)
      responses: { '200': { description: flushed } }
  /protection/enable:
    post:
      summary: Enable filtering
      responses: { '200': { description: enabled } }
  /protection/disable:
    post:
      summary: Disable filtering (requires ?confirm=true)
      responses: { '200': { description: disabled }, '400': { description: confirm missing } }
  /backup:
    post:
      summary: Download a zip backup (?include_history=true adds query log)
      responses: { '200': { description: application/zip } }
  /restore:
    post:
      summary: Restore a backup archive (requires ?confirm=true)
      responses: { '200': { description: restored }, '400': { description: invalid archive } }
  /backup/inspect:
    post:
      summary: Validate an archive and list what would be replaced
      responses: { '200': { description: manifest + row counts } }
  /network/interfaces:
    get:
      summary: Local network interfaces
      responses: { '200': { description: interfaces } }
  /network/info:
    get:
      summary: LAN address, gateway guess, listeners
      responses: { '200': { description: network info } }
  /network/port-check:
    get:
      summary: Check whether a UDP+TCP bind on addr succeeds
      parameters: [ { name: addr, in: query, required: true, schema: { type: string } } ]
      responses: { '200': { description: udp_free/tcp_free } }
  /diagnostics:
    get:
      summary: Rule-engine + service diagnostics (?domain=)
      responses: { '200': { description: diagnostics } }
  /diagnostics/export:
    get:
      summary: Download a diagnostic bundle (JSON)
      responses: { '200': { description: diagnostic bundle } }
  /system/health:
    get:
      summary: Health snapshot plus recent history
      responses: { '200': { description: health report } }
  /network/protection:
    get:
      summary: Honest network-protection state (configured vs observed vs enforced)
      responses: { '200': { description: protection report } }
  /policies/groups:
    get:
      summary: List policy groups
      responses: { '200': { description: groups } }
    post:
      summary: Create a policy group (enabled by default)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                enabled: { type: boolean, default: true }
                upstream_id: { type: integer }
      responses:
        '201': { description: created group }
        '400': { description: validation failed }
        '409': { description: duplicate name }
  /policies/groups/{id}:
    patch:
      summary: Update a policy group
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated group } }
    delete:
      summary: Delete a policy group
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /policies/groups/{id}/duplicate:
    post:
      summary: Duplicate a group including its assignments and list restrictions
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '201': { description: new group } }
  /policies/assignments:
    get:
      summary: List policy assignments
      responses: { '200': { description: assignments } }
    post:
      summary: Assign a client/IP/CIDR to a group
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, value, group_id]
              properties:
                kind: { type: string, enum: [client, ip, cidr] }
                value: { type: string, description: client id, IP, or CIDR }
                group_id: { type: integer }
      responses:
        '201': { description: created assignment }
        '400': { description: validation failed }
  /policies/assignments/{id}:
    delete:
      summary: Remove a policy assignment
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /policies/simulate:
    post:
      summary: Dry-run a DNS decision for a domain from a client/IP/group
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                client_id: { type: integer }
                client_ip: { type: string }
                group_id: { type: integer }
      responses: { '200': { description: decision + explanation trace } }
  /rules/inspect:
    get:
      summary: Explain the decision for a domain+subject with a full trace
      parameters:
        - { name: domain, in: query, required: true, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: integer } }
        - { name: group_id, in: query, schema: { type: integer } }
      responses: { '200': { description: explanation } }
  /rules/batch-test:
    post:
      summary: Evaluate many domains at once and return decisions
      responses: { '200': { description: per-domain results } }
  /rules/conflicts:
    get:
      summary: Detect shadowed and contradictory rules
      responses: { '200': { description: conflict report } }
  /schedules:
    get:
      summary: List protection schedules
      responses: { '200': { description: schedules } }
    post:
      summary: Create a schedule (enabled by default)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, effect, target_kind, target_id, days_mask, start_min, end_min]
              properties:
                name: { type: string }
                effect: { type: string, enum: [protection_off, protection_on, extra_lists] }
                target_kind: { type: string, enum: [all, group, client] }
                target_id: { type: integer }
                days_mask: { type: integer, description: 'bit i = weekday i, Sunday=0' }
                start_min: { type: integer, description: 'minutes after midnight 0-1439' }
                end_min: { type: integer, description: 'may be < start_min (crosses midnight)' }
                tz: { type: string, description: 'IANA zone, defaults to UTC' }
                list_ids: { type: array, items: { type: integer }, description: 'extra_lists only' }
                enabled: { type: boolean, default: true }
      responses: { '201': { description: created schedule } }
  /schedules/{id}:
    patch:
      summary: Update a schedule
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated schedule } }
    delete:
      summary: Delete a schedule
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /schedules/{id}/preview:
    get:
      summary: Next activation windows for a schedule
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: upcoming windows } }
  /local-dns:
    get:
      summary: List local DNS records
      responses: { '200': { description: records } }
    post:
      summary: Create a local DNS record (enabled by default); returns warnings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type, value]
              properties:
                name: { type: string }
                type: { type: string, enum: [A, AAAA, CNAME, TXT, PTR] }
                value: { type: string }
                ttl: { type: integer }
                enabled: { type: boolean, default: true }
                comment: { type: string }
      responses: { '201': { description: record + conflict warnings } }
  /local-dns/{id}:
    patch:
      summary: Update a local DNS record
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated record } }
    delete:
      summary: Delete a local DNS record
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: deleted } }
  /local-dns/test:
    post:
      summary: Resolve a name against the local DNS table without a live query
      responses: { '200': { description: resolution result } }
  /discovery/events:
    get:
      summary: Recent discovery events (new devices, identity changes)
      responses: { '200': { description: events } }
  /discovery/events/{id}/ack:
    post:
      summary: Acknowledge a discovery event
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: acknowledged } }
  /discovery/scan:
    post:
      summary: Run an on-demand passive discovery scan
      responses: { '200': { description: scan result } }
  /clients/{id}/identities:
    get:
      summary: Identity bindings for a client (MAC, hostname, DHCP)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: identities } }
    post:
      summary: Bind an identity to a client
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '201': { description: created identity } }
  /clients/{id}/identities/{iid}:
    delete:
      summary: Remove an identity binding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: iid, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: deleted } }
  /clients/{id}/stats:
    get:
      summary: Per-client query stats and top domains
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: client stats } }
  /blocklists/{id}/history:
    get:
      summary: Refresh/update history for a blocklist
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: history entries } }
  /blocklists/{id}/groups:
    get:
      summary: Groups this blocklist is restricted to
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: group ids } }
    put:
      summary: Set group restrictions (empty = applies to everyone)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: updated } }
  /blocklists/profiles:
    get:
      summary: Bundled blocklist profiles
      responses: { '200': { description: profiles } }
  /blocklists/profile:
    post:
      summary: Apply a blocklist profile to a group or globally
      responses: { '200': { description: applied } }
  /blocklists/recommendations:
    get:
      summary: Quality analysis, overlap and recommendations
      responses: { '200': { description: recommendations } }
  /stats/latency:
    get:
      summary: Upstream latency percentiles
      responses: { '200': { description: latency stats } }
  /stats/errors:
    get:
      summary: DNS error breakdown (SERVFAIL, timeouts, refusals)
      responses: { '200': { description: error counts } }
  /stats/groups:
    get:
      summary: Per-policy-group query stats
      responses: { '200': { description: group stats } }
  /stats/domain:
    get:
      summary: Investigate a domain (?domain=) — clients, decisions, first/last seen
      parameters: [ { name: domain, in: query, required: true, schema: { type: string } } ]
      responses: { '200': { description: domain investigation } }
  /upstreams/{id}/health:
    get:
      summary: Health history for one upstream
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: health entries } }
  /audit/log:
    get:
      summary: Queryable audit log (?action=&actor=&limit=&offset=)
      responses: { '200': { description: audit entries } }
  /audit/export:
    get:
      summary: Export the audit log as JSON
      responses: { '200': { description: audit export } }
  /enforcement/integrations:
    get:
      summary: Configured router/DHCP enforcement integrations
      responses: { '200': { description: integrations } }
  /enforcement/preview:
    post:
      summary: Preview what an enforcement change would do (no side effects)
      responses: { '200': { description: change plan } }
  /enforcement/apply:
    post:
      summary: Apply an enforcement plan to the configured integration
      responses: { '200': { description: operation record } }
  /enforcement/operations:
    get:
      summary: History of enforcement operations
      responses: { '200': { description: operations } }
  /enforcement/rollback/{id}:
    post:
      summary: Roll back an applied enforcement operation
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: rollback result } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: blacknet_session }
    bearerToken: { type: http, scheme: bearer }
security:
  - sessionCookie: []
  - bearerToken: []
